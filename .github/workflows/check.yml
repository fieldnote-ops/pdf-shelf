name: check

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依赖
        run: python3 -m pip install --quiet pyyaml
      - name: 校验书架
        run: python3 scripts/check_repo.py
